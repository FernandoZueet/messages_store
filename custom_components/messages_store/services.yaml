generate_ai_messages:
  name: "Generate AI Messages"
  description: "Generates a list of messages using AI based on instructions and optionally a base slug. Requires an AI Task entity configured in integration options."
  fields:
    task_name:
      name: "Task Name"
      description: "Name of the task."
      required: true
      selector:
        text: {}
      example: "motivation"
    instructions:
      name: "Instructions"
      description: "Instructions for the AI to generate the messages."
      required: true
      selector:
        text: {}
      example: "Create motivational messages for morning routines."
    quantity:
      name: "Quantity"
      description: "Number of messages to generate."
      required: true
      selector:
        number:
          min: 1
          max: 100
          mode: box
      example: 5
    slug:
      name: "Base Slug"
      description: "Slug of existing messages to use as a base for generation. Optional."
      required: false
      selector:
        text: {}
      example: "greeting_message"

get_ai_task_configured:
  name: "Check AI Task configuration"
  description: "Reports whether Messages Store has a configured AI Task entity."

get_ai_task_settings:
  name: "Get AI Task settings"
  description: "Returns the selected AI Task, shared prompt, and available AI Task entities."

set_ai_task_settings:
  name: "Save AI Task settings"
  description: "Updates the AI Task and prompt used by Messages Store, including its integration options."
  fields:
    ai_task_entity_id:
      name: "AI Task entity"
      description: "AI Task entity ID, or null to clear the selection."
      required: true
      selector:
        text: {}
    instructions:
      name: "General prompt"
      description: "Shared instructions added to each AI message generation request."
      required: true
      selector:
        text:
          multiline: true


add_message:
  name: "Add Message"
  description: "Adds a new message."
  fields:
    slug:
      name: "Identifier"
      description: "Unique identifier for the message, using only alphanumeric characters and underscores."
      required: true
      selector:
        text: {}
      example: "welcome_message"
    message:
      name: "Message"
      description: "The content of the message. It can be a string or a list of strings."
      required: true
      selector:
        object: {}
      example: "Hello, welcome home!"
    tags:
      name: "Tags"
      description: "Optional collection tags."
      required: false
      selector:
        object: {}
    favorite:
      name: "Favorite"
      description: "Optional favorite flag."
      required: false
      selector:
        boolean: {}

get_message:
  name: "Get Message"
  description: "Retrieves a message by its identifier."
  fields:
    slug:
      name: "Identifier"
      description: "Unique identifier for the message."
      required: true
      selector:
        text: {}
      example: "welcome_message"
    replace:
      name: "Replacements"
      description: "List of values to replace placeholders in the message."
      required: false
      selector:
        object: {}
      example: ['John', '25°C']
    filter:
      name: "Filter"
      description: "Optional filter to modify the retrieval of the message. Use 'random' to get a random message from a list."
      required: false
      selector:
        select:
          mode: dropdown
          options:
            - label: Random
              value: random
      example: "random"

get_messages:
  name: "Get Multiple Messages"
  description: "Retrieves multiple messages based on an optional filter."
  fields:
    filter:
      name: "Filter"
      description: "Optional filter to search for specific messages with optional replacements."
      required: false
      selector:
        object: {}
      example: 
        - slug: "welcome_message"
          replace: 
            - "10%"
          filter: random
        - slug: "arrived_home"
        - slug: "alarm_trigged"
    grouped:
      name: "Grouped"
      description: "If true, messages will be grouped by slug in the response."
      required: false
      selector:
        boolean: {}
      example: true
    force_random:
      name: "Force Random"
      description: "Forces random selection of messages for all slugs."
      required: false
      selector:
        boolean: {}
      example: false

edit_message:
  name: "Edit Message"
  description: "Edits an existing message."
  fields:
    slug:
      name: "Identifier"
      description: "Unique identifier for the message to be edited."
      required: true
      selector:
        text: {}
      example: "welcome_message"
    message:
      name: "New Message"
      description: "New content of the message. It can be a string or a list of strings."
      required: true
      selector:
        object: {}
      example: "Hello again, welcome back!"
    tags:
      name: "Tags"
      description: "Optional collection tags; omitted fields keep stored metadata."
      required: false
      selector:
        object: {}
    favorite:
      name: "Favorite"
      description: "Optional favorite flag; omitted fields keep stored metadata."
      required: false
      selector:
        boolean: {}

delete_message:
  name: "Delete Message"
  description: "Deletes a message by its identifier."
  fields:
    slug:
      name: "Identifier"
      description: "Unique identifier for the message to be deleted."
      required: true
      selector:
        text: {}
      example: "welcome_message"

add_bulk_messages:
  name: "Add Bulk Messages"
  description: "Adds multiple messages at once."
  fields:
    data:
      name: "Messages Data"
      description: "A dictionary where each key is a slug and the corresponding value is a list of messages."
      required: true
      selector:
        object: {}
      example: >
        {
          "morning_greeting": ["Good morning!", "Have a great day!"],
          "evening_greeting": ["Good evening!", "Hope you had a great day!"]
        }

update_message_metadata:
  name: "Update message metadata"
  description: "Updates tags and favorite status without changing messages."
  fields:
    slug:
      required: true
      selector:
        text: {}
    tags:
      required: false
      selector:
        object: {}
    favorite:
      required: false
      selector:
        boolean: {}

import_messages:
  name: "Import message collection"
  description: "Imports JSON or YAML; existing slugs are skipped."
  fields:
    content:
      required: true
      selector:
        text:
          multiline: true
    format:
      required: true
      selector:
        select:
          options:
            - json
            - yaml

export_messages:
  name: "Export message collection"
  description: "Returns the complete collection as JSON or YAML."
  fields:
    format:
      required: false
      selector:
        select:
          options:
            - json
            - yaml
